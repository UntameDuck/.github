name: Deploy interactive pond dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - '.github/workflows/deploy-pond-dashboard.yml'
  workflow_run:
    workflows: ['Refresh pond activity']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pond-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm the interactive data exists
        run: |
          test -s docs/index.html
          test -s docs/activity-data.json
          python -m json.tool docs/activity-data.json > /dev/null
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish interactive dashboard
        id: deployment
        uses: actions/deploy-pages@v4
