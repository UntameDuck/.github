name: Refresh pond activity

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *' # Daily, 09:23 KST

permissions:
  contents: write

concurrency:
  group: pond-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate real public activity
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_STATS_TOKEN || github.token }}
        run: python scripts/update_pond_activity.py
      - name: Commit refreshed visualizations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/README.md profile/assets/org-contributions.svg profile/assets/pond-contributors.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh UntameDuck pond activity'
            git push
          fi
